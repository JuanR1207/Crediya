server:
  port: 8080
spring:
  application:
    name: "autenticacion-crediya-ms"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  datasource:
    # Modo archivo: los usuarios quedan guardados aunque se reinicie la aplicación (carpeta ./data)
    url: "jdbc:h2:file:./data/autenticacion-db;AUTO_SERVER=TRUE"
    username: "sa"
    password: ""
    driverClassName: "org.h2.Driver"
  jpa:
    databasePlatform: "org.hibernate.dialect.H2Dialect"
springdoc:
  swagger-ui.path: "/v3/swagger-ui.html"
  api-docs.path: "/v3/api-docs"
  show-actuator: true
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
logging:
  level:
    co.com.bancolombia: DEBUG
